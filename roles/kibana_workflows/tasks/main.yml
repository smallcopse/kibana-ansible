---
# ============================================================================
# エントリポイント。全体の流れ:
#   1. Kibana 接続準備（kibana_common: 接続チェック + URL + ヘッダ生成）
#      Workflows API は elastic-api-version ヘッダが必要なので kibana_extra_headers で渡す
#   2. workflow の一覧を一度だけ取得する
#   3. kibana_workflows を 1 件ずつ manage_workflow.yml で処理
#
# ロール変数の型・選択肢チェックは meta/argument_specs.yml が自動で行う。
# 各 workflow 要素の必須項目・相互依存は manage_workflow.yml でチェックする。
# ============================================================================

# --- 1. 接続準備。_kibana_api_base と _kibana_headers を生成する ---
#   elastic-api-version ヘッダを追加ヘッダとして渡す
- name: Set up Kibana connection
  ansible.builtin.include_role:
    name: kibana_common
    tasks_from: connect.yml
  vars:
    kibana_extra_headers:
      elastic-api-version: "{{ kibana_workflows_api_version }}"

# --- 2. workflow 一覧を一度だけ取得する（GET なので --check でも実行） ---
- name: Fetch existing workflows
  ansible.builtin.include_role:
    name: kibana_common
    tasks_from: request.yml
  vars:
    kr_name: "GET {{ kibana_workflows_list_path }}"
    kr_method: GET
    kr_url: "{{ _kibana_api_base }}{{ kibana_workflows_list_path }}{{ kibana_workflows_list_query }}"
    kr_status: [200]
    kr_check_mode: false

# --- レスポンスから workflow の配列を取り出す ---
#   レスポンスが {results: [...]} 形式ならそのキー、配列そのものならそのまま使う
- name: "Store existing workflows"
  ansible.builtin.set_fact:
    _kibana_existing_workflows: >-
      {{ kibana_request.json[kibana_workflows_list_key]
         if (kibana_request.json is mapping and kibana_workflows_list_key in kibana_request.json)
         else kibana_request.json }}

# --- 3. workflow を 1 件ずつ処理する（作成 / 更新 / 削除） ---
- name: Manage Kibana workflows
  ansible.builtin.include_tasks: manage_workflow.yml
  loop: "{{ kibana_workflows }}"
  loop_control:
    loop_var: workflow
    label: "{{ workflow.name | default('<unnamed>') }}"
