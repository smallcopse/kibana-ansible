---
# ------------------------------------------------------------------------------
# 接続設定（kibana_rules role と同じ変数名。group_vars で共用できる）
# ------------------------------------------------------------------------------
kibana_url: "http://localhost:5601"

# コネクターを管理する Kibana スペース。"" (空) はデフォルトスペース。
kibana_space: ""

kibana_validate_certs: true
kibana_request_timeout: 30

# 認証方式: "api_key" または "basic"
kibana_auth_method: "api_key"

# api_key 方式の場合: エンコード済み API キー (base64("<id>:<api_key>"))
kibana_api_key: ""

# basic 方式の場合
kibana_username: ""
kibana_password: ""

# ------------------------------------------------------------------------------
# 動作設定
# ------------------------------------------------------------------------------
# present -> 未作成のコネクターを作成し、name / config に差分があれば更新する
# absent  -> リストに指定したコネクター (name で突合) が存在すれば削除する
kibana_connectors_state: "present"

# 差分が検出されなくても常に PUT (更新) を実行する。
# Kibana は secrets を返さないため差分比較できない。
# secrets（トークン等）をローテーションしたいときはこれを true にする。
kibana_connectors_force_update: false

# ------------------------------------------------------------------------------
# 管理対象のコネクター。スキーマとサンプルは README.md と examples/ を参照。
# ------------------------------------------------------------------------------
kibana_connectors: []
