---
# ------------------------------------------------------------------------------
# 接続設定
# ------------------------------------------------------------------------------
kibana_url: "http://localhost:5601"

# ルールを管理する Kibana スペース。"" (空) の場合はデフォルトスペースを対象にする。
kibana_space: ""

kibana_validate_certs: true
kibana_request_timeout: 30

# 認証方式: "api_key" または "basic"
kibana_auth_method: "api_key"

# kibana_auth_method: api_key の場合
#   エンコード済みの API キー (POST /_security/api_key のレスポンスの "encoded" 値、
#   つまり base64("<id>:<api_key>")) を指定する。
kibana_api_key: ""

# kibana_auth_method: basic の場合
kibana_username: ""
kibana_password: ""

# ------------------------------------------------------------------------------
# 動作設定
# ------------------------------------------------------------------------------
# present -> 未作成のルールを作成し、差分のあるルールを更新し、有効/無効状態を合わせる
# absent  -> リストに指定したルール (name で突合) が存在すれば削除する
kibana_rules_state: "present"

# ルールアクション内の `connector_name` を、GET /api/actions/connectors を照会して
# connector id に解決する。常に `id` を直接指定する場合は false にする。
kibana_rules_resolve_connectors: true

# 差分が検出されなくても常に PUT (更新) を実行する。
# `actions` だけが変わった場合に有用 (アクションのみの差分は検出しない。README 参照)。
kibana_rules_force_update: false

# ------------------------------------------------------------------------------
# 管理対象のルール。スキーマとサンプルは README.md と examples/ を参照。
# ------------------------------------------------------------------------------
kibana_rules: []
