---
# 使い方:
#   ansible-playbook playbooks/manage-workflows.yml -e @examples/workflows.yml
#
# 接続情報と kibana_workflows は extra-vars ファイル (examples/ 参照)、
# もしくは group_vars / 自前の Vault 暗号化ファイルで渡す。
- name: Manage Kibana workflows
  hosts: "{{ target_hosts | default('localhost') }}"
  gather_facts: false
  roles:
    - role: kibana_workflows
