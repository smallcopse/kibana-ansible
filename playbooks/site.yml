---
# コネクター -> ルール -> workflow の順でまとめて適用する。
# ルール / workflow のアクションが参照するコネクターを先に作るため、この順序にする。
#
# 使い方:
#   ansible-playbook playbooks/site.yml -e @vars/kibana.yml
#   （vars ファイルに kibana_connectors / kibana_rules / kibana_workflows を定義しておく）
- name: Manage Kibana connectors, alerting rules and workflows
  hosts: "{{ target_hosts | default('localhost') }}"
  gather_facts: false
  roles:
    - role: kibana_connectors
    - role: kibana_rules
    - role: kibana_workflows
