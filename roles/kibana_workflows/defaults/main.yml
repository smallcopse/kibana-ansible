---
# ------------------------------------------------------------------------------
# 接続設定は kibana_common ロール（依存）の defaults で定義している。
#   kibana_url / kibana_space / kibana_validate_certs / kibana_request_timeout /
#   kibana_auth_method / kibana_api_key / kibana_username / kibana_password
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# Workflows API の設定
#   Workflows は技術プレビュー段階（Enterprise ライセンス必須）で、
#   API のパスやバージョンは変わる可能性があるため変数で上書きできるようにしている。
#   Kibana 側で有効化が必要:
#     workflows:ui:enabled は uiSettings、workflows:experimentalFeatures: true など
# ------------------------------------------------------------------------------
kibana_workflows_api_version: "2023-10-31"      # elastic-api-version ヘッダ
kibana_workflows_list_path: "/api/workflows"            # 一覧取得 (GET)
kibana_workflows_item_path: "/api/workflows/workflow"   # 作成 (POST) / 更新・削除 (…/{id})

# 一覧取得 URL に付けるクエリ文字列（"?" から書く。全件取れるページサイズを指定する）。
# API がページングのパラメータ名を変えた場合はここで上書きする（例: "?perPage=1000"）。
kibana_workflows_list_query: "?limit=1000"

# 一覧レスポンスで配列が入っているキー。レスポンスが配列そのものなら無視される。
kibana_workflows_list_key: "results"

# ------------------------------------------------------------------------------
# 動作設定
# ------------------------------------------------------------------------------
# present -> 未作成の workflow を作成し、定義に差分があれば更新する
# absent  -> リストに指定した workflow (name で突合) が存在すれば削除する
kibana_workflows_state: "present"

# 差分を判定できない場合や、強制的に更新したい場合に true にする
kibana_workflows_force_update: false

# ------------------------------------------------------------------------------
# 管理対象の workflow。スキーマとサンプルは README.md と examples/ を参照。
# ------------------------------------------------------------------------------
kibana_workflows: []
