---
# ============================================================================
# Kibana API 呼び出しの共通処理。各タスクから include_tasks + vars で呼ぶ。
# 認証・TLS 検証・タイムアウト・ヘッダの指定を 1 か所にまとめるためのラッパ。
#
# 呼び出し側で設定する変数:
#   kr_name        - タスクの表示ラベル
#   kr_method      - GET | POST | PUT | DELETE
#   kr_url         - 完全な URL
#   kr_body        - 送信する dict（任意。GET など不要なら省略）
#   kr_status      - 許容するステータスコードのリスト（例: [200] / [204]）
#   kr_changed     - 成功時に "changed" 扱いにするか（bool、既定 false）
#   kr_check_mode  - bool（任意。--check 時にも必ず実行したい読み取り系は false）
#
# 実行結果は `kibana_request` として register され、呼び出し元から参照できる。
# ============================================================================
- name: "{{ kr_name }}"
  ansible.builtin.uri:
    url: "{{ kr_url }}"
    method: "{{ kr_method }}"
    # main.yml で組み立てた共通ヘッダ（kbn-xsrf、api_key 方式なら Authorization）
    headers: "{{ _kibana_headers }}"
    # basic 認証用。api_key 方式では空になるので omit されて無効化される
    url_username: "{{ kibana_username | default(omit, true) }}"
    url_password: "{{ kibana_password | default(omit, true) }}"
    force_basic_auth: "{{ kibana_auth_method == 'basic' }}"
    validate_certs: "{{ kibana_validate_certs }}"
    timeout: "{{ kibana_request_timeout }}"
    body_format: json
    # body が未指定なら omit（GET / DELETE / enable / disable など）
    body: "{{ kr_body | default(omit) }}"
    status_code: "{{ kr_status }}"
    # レスポンス本文が必要なのは GET のときだけ
    return_content: "{{ kr_method == 'GET' }}"
  register: kibana_request
  # kr_check_mode 未指定なら通常どおり --check の対象になる
  check_mode: "{{ kr_check_mode | default(omit) }}"
  # 変更系の呼び出し（作成・更新・削除など）だけ changed にする
  changed_when: "{{ kr_changed | default(false) | bool }}"
