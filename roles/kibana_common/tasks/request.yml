---
# ============================================================================
# Kibana API 呼び出しの共通ラッパ。各ロールから次のように呼ぶ:
#   - name: "..."
#     ansible.builtin.include_role:
#       name: kibana_common
#       tasks_from: request.yml
#     vars:
#       kr_name: "POST /api/..."
#       kr_method: POST
#       kr_url: "{{ _kibana_api_base }}/api/..."
#       kr_body: { ... }        # 任意
#       kr_status: [200]
#       kr_changed: true        # 任意（既定 false）
#       kr_check_mode: false    # 任意（読み取り系で --check 時も実行したいとき）
#
# 実行結果は `kibana_request` として register され、呼び出し元から参照できる。
# ============================================================================
- name: "{{ kr_name }}"
  ansible.builtin.uri:
    url: "{{ kr_url }}"
    method: "{{ kr_method }}"
    headers: "{{ _kibana_headers }}"
    url_username: "{{ kibana_username | default(omit, true) }}"
    url_password: "{{ kibana_password | default(omit, true) }}"
    force_basic_auth: "{{ kibana_auth_method == 'basic' }}"
    validate_certs: "{{ kibana_validate_certs }}"
    timeout: "{{ kibana_request_timeout }}"
    body_format: json
    body: "{{ kr_body | default(omit) }}"
    status_code: "{{ kr_status }}"
    return_content: "{{ kr_method == 'GET' }}"
  register: kibana_request
  check_mode: "{{ kr_check_mode | default(omit) }}"
  changed_when: "{{ kr_changed | default(false) | bool }}"
