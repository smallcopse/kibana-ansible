---
# 使い方:
#   ansible-playbook playbooks/manage-rules.yml -e @examples/observability-rules.yml
#
# 接続情報と kibana_rules は extra-vars ファイル (examples/ 参照)、
# もしくは group_vars / 自前の Vault 暗号化ファイルで渡す。
- name: Manage Kibana Observability & Stack Management rules
  hosts: "{{ target_hosts | default('localhost') }}"
  gather_facts: false
  roles:
    - role: kibana_rules
