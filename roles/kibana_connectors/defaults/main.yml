---
# ------------------------------------------------------------------------------
# 接続設定は kibana_common ロール（依存）の defaults で定義している。
#   kibana_url / kibana_space / kibana_validate_certs / kibana_request_timeout /
#   kibana_auth_method / kibana_api_key / kibana_username / kibana_password
# ------------------------------------------------------------------------------

# ------------------------------------------------------------------------------
# 動作設定
# ------------------------------------------------------------------------------
# present -> 未作成のコネクターを作成し、name / config に差分があれば更新する
# absent  -> リストに指定したコネクター (name で突合) が存在すれば削除する
kibana_connectors_state: "present"

# 差分が検出されなくても常に PUT (更新) を実行する。
# Kibana は secrets を返さないため差分比較できない。
# secrets（トークン等）をローテーションしたいときはこれを true にする。
kibana_connectors_force_update: false

# ------------------------------------------------------------------------------
# 管理対象のコネクター。スキーマとサンプルは README.md と examples/ を参照。
# ------------------------------------------------------------------------------
kibana_connectors: []
