---
# ============================================================================
# エントリポイント。全体の流れ:
#   1. 変数チェック
#   2. Kibana API のベース URL と認証ヘッダを組み立てる
#   3. kibana_connectors を 1 件ずつ manage_connector.yml で処理
# ============================================================================

# --- 1. 必須変数と値の妥当性をチェック ---
- name: Validate role variables
  ansible.builtin.assert:
    that:
      - kibana_url | length > 0
      - kibana_auth_method in ['api_key', 'basic']
      - (kibana_auth_method != 'api_key') or (kibana_api_key | length > 0)
      - (kibana_auth_method != 'basic') or (kibana_username | length > 0 and kibana_password | length > 0)
      - kibana_connectors_state in ['present', 'absent']
      - kibana_connectors is iterable
    quiet: true
    fail_msg: "kibana_connectors role variables are invalid - check auth settings and kibana_connectors_state"

# --- 2a. API 呼び出しのベース URL を作る（末尾スラッシュ除去 + スペース付与） ---
- name: Build Kibana API base URL
  ansible.builtin.set_fact:
    _kibana_api_base: >-
      {{ (kibana_url | regex_replace('/+$', ''))
         ~ (('/s/' ~ kibana_space) if (kibana_space | length > 0) else '') }}

# --- 2b. 全リクエスト共通の HTTP ヘッダを作る ---
#   kbn-xsrf は必須。api_key 方式のときだけ Authorization ヘッダを付ける
- name: Build Kibana request headers
  ansible.builtin.set_fact:
    _kibana_headers: >-
      {{ _base_headers
         | combine({'Authorization': 'ApiKey ' ~ kibana_api_key}
                   if kibana_auth_method == 'api_key' else {}) }}
  vars:
    _base_headers:
      kbn-xsrf: "ansible"
      Content-Type: "application/json"

# --- 2c. 既存コネクター一覧を一度だけ取得する ---
#   コネクター数は通常少ないので、ルールのように 1 件ずつ検索せず全件取得して
#   manage_connector.yml 内で name 突合する。GET なので --check でも実行する
- name: Fetch existing Kibana connectors
  ansible.builtin.include_tasks: request.yml
  vars:
    kr_name: "GET /api/actions/connectors"
    kr_method: GET
    kr_url: "{{ _kibana_api_base }}/api/actions/connectors"
    kr_status: [200]
    kr_check_mode: false

- name: "Store existing connectors"
  ansible.builtin.set_fact:
    _kibana_existing_connectors: "{{ kibana_request.json }}"

# --- 3. コネクターを 1 件ずつ処理する（作成 / 更新 / 削除） ---
- name: Manage Kibana connectors
  ansible.builtin.include_tasks: manage_connector.yml
  loop: "{{ kibana_connectors }}"
  loop_control:
    loop_var: connector
    label: "{{ connector.name | default('<unnamed>') }}"
