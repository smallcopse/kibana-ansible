---
# extra-vars ファイルの例:
#   ansible-playbook playbooks/manage-rules.yml -e @examples/observability-rules.yml
#
# 実際のシークレットはここに書かず、ansible-vault で暗号化したファイルに置くこと。

kibana_url: "https://kibana.example.com:5601"
kibana_space: ""                       # "" = デフォルトスペース
kibana_auth_method: "api_key"
kibana_api_key: "{{ vault_kibana_api_key }}"   # エンコード済み API キー
kibana_validate_certs: true

kibana_rules_state: present

kibana_rules:

  # ---------------------------------------------------------------------------
  # Observability -> Alerts : カスタムしきい値 (Custom threshold)
  # ---------------------------------------------------------------------------
  - name: "[o11y] High CPU - prod hosts"
    rule_type_id: "observability.rules.custom_threshold"
    consumer: "observability"
    tags: ["observability", "infra", "prod"]
    enabled: true
    schedule:
      interval: "1m"
    params:
      searchConfiguration:
        query:
          query: ""
          language: "kuery"
        index: "metrics-*"
      criteria:
        - comparator: ">"
          threshold: [85]
          timeSize: 5
          timeUnit: "m"
          metrics:
            - name: "A"
              aggType: "avg"
              field: "system.cpu.total.norm.pct"
      alertOnNoData: false
      alertOnGroupDisappear: false
      groupBy: ["host.name"]
    actions:
      - group: "custom_threshold.fired"
        connector_name: "Ops Slack"
        params:
          message: >-
            {{ '{{context.reason}}' }}
        frequency:
          notify_when: "onActionGroupChange"
          throttle: null
          summary: false

  # ---------------------------------------------------------------------------
  # Observability -> Logs : ログしきい値 (Log threshold)
  # ---------------------------------------------------------------------------
  - name: "[o11y] Error log spike - checkout service"
    rule_type_id: "logs.alert.document.count"
    consumer: "logs"
    tags: ["observability", "logs"]
    enabled: true
    schedule:
      interval: "1m"
    params:
      timeSize: 5
      timeUnit: "m"
      logView:
        type: "log-view-reference"
        logViewId: "default"
      count:
        value: 25
        comparator: "more than"
      criteria:
        - field: "log.level"
          comparator: "equals"
          value: "error"
        - field: "service.name"
          comparator: "equals"
          value: "checkout"
    actions: []

  # ---------------------------------------------------------------------------
  # Observability -> SLO : バーンレート (Burn rate)
  # ---------------------------------------------------------------------------
  - name: "[o11y] SLO burn rate - checkout availability"
    rule_type_id: "slo.rules.burnRate"
    consumer: "slo"
    tags: ["observability", "slo"]
    enabled: true
    schedule:
      interval: "1m"
    params:
      sloId: "REPLACE-WITH-SLO-ID"
      windows:
        - id: "1"
          burnRateThreshold: 14.4
          maxBurnRateThreshold: 720
          longWindow: {value: 1, unit: "h"}
          shortWindow: {value: 5, unit: "m"}
          actionGroup: "slo.burnRate.alert"
        - id: "2"
          burnRateThreshold: 6
          maxBurnRateThreshold: 240
          longWindow: {value: 6, unit: "h"}
          shortWindow: {value: 30, unit: "m"}
          actionGroup: "slo.burnRate.high"
    actions: []
